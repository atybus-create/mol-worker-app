<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050b12">
  <title>MOL App V2 TEST - Brak internetu</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050b12;color:#f4f8fb;font-family:Inter,system-ui,sans-serif}
    main{max-width:32rem;padding:28px;text-align:center}h1{margin:0 0 12px}p{color:#b9c9d6;line-height:1.5}button{border:0;border-radius:10px;background:#12c8ff;color:#051018;padding:12px 16px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <h1>Brak połączenia z internetem</h1>
    <p>Interfejs aplikacji może być dostępny, ale nie można odczytać aktualnych danych ani zapisać czasu pracy lub procesu. Po odzyskaniu internetu odśwież aplikację i ponów operację.</p>
    <button type="button" onclick="location.reload()">Odśwież</button>
  </main>
</body>
</html>
