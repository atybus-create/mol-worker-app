name: V3 backend frontend cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v3-backend-cutover.yml'

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cut production runtime over to V3 routes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements_by_file = {
              Path('pwa/web/live.js'): {
                  'mol-app-v2-leader-team': 'mol-app-v3-leader-team',
                  'mol-app-v2-report-performance': 'mol-app-v3-report-performance',
                  'mol-app-v2-report-attendance': 'mol-app-v3-report-attendance',
              },
              Path('pwa/shared/api.js'): {
                  "request('mol-app-v2-auth-login'": "request('mol-app-v3-auth-login'",
                  "request('mol-app-v2-auth-session'": "request('mol-app-v3-auth-session'",
                  "request('mol-app-v2-auth-logout'": "request('mol-app-v3-auth-logout'",
                  "const BUILD = '20260914.2';": "const BUILD = '20260917.6-v3-cutover';",
              },
              Path('pwa/web/app.js'): {
                  "const BUILD='20260917.5-report-selection';": "const BUILD='20260917.6-v3-cutover';",
              },
              Path('pwa/mobile/app.js'): {
                  "const BUILD = '20260917.4-mobile-logout';": "const BUILD = '20260917.6-v3-cutover';",
              },
          }
          for p, replacements in replacements_by_file.items():
              text = p.read_text(encoding='utf-8')
              changed = text
              for old, new in replacements.items():
                  changed = changed.replace(old, new)
              if changed != text:
                  p.write_text(changed, encoding='utf-8')
                  print('updated', p)

          sw = Path('pwa/sw.js')
          text = sw.read_text(encoding='utf-8')
          marker = '20260917.6-v3-cutover'
          if marker not in text:
              text = text.replace('20260917.5-report-selection', marker).replace('20260917.4-mobile-logout', marker)
              sw.write_text(text, encoding='utf-8')
              print('updated', sw)

          reg = Path('pwa/pwa-register.js')
          text = reg.read_text(encoding='utf-8')
          text2 = text.replace('20260917.5-report-selection', '20260917.6-v3-cutover').replace('20260917.4-mobile-logout', '20260917.6-v3-cutover')
          if text2 != text:
              reg.write_text(text2, encoding='utf-8')
              print('updated', reg)
          PY
          grep -q "mol-app-v3-leader-team" pwa/web/live.js
          grep -q "mol-app-v3-report-performance" pwa/web/live.js
          grep -q "mol-app-v3-report-attendance" pwa/web/live.js
          ! grep -q "api.read('mol-app-v2-leader-team'" pwa/web/live.js
          ! grep -q "api.read('mol-app-v2-report-performance'" pwa/web/live.js
          ! grep -q "api.read('mol-app-v2-report-attendance'" pwa/web/live.js
          grep -q "request('mol-app-v3-auth-login'" pwa/shared/api.js
          grep -q "request('mol-app-v3-auth-session'" pwa/shared/api.js
          grep -q "request('mol-app-v3-auth-logout'" pwa/shared/api.js
          node --check pwa/shared/api.js
          node --check pwa/web/live.js
          node --check pwa/web/app.js
          node --check pwa/mobile/app.js
          node --check pwa/sw.js
      - name: Remove temporary workflow and commit cutover
        run: |
          git rm .github/workflows/v3-backend-cutover.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pwa
          git commit -m 'Cut production frontend over to V3 routes'
          git push origin HEAD:main
