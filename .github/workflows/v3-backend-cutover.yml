name: V3 backend frontend cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v3-backend-cutover.yml'

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Replace remaining V2 frontend routes and labels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'mol-app-v2-leader-team': 'mol-app-v3-leader-team',
              'mol-app-v2-report-performance': 'mol-app-v3-report-performance',
              'mol-app-v2-report-attendance': 'mol-app-v3-report-attendance',
              'backendu V2': 'backendu V3',
              'backend V2': 'backend V3',
          }
          for p in Path('pwa').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.js', '.mjs', '.html', '.css'}:
                  continue
              text = p.read_text(encoding='utf-8')
              changed = text
              for old, new in replacements.items():
                  changed = changed.replace(old, new)
              if changed != text:
                  p.write_text(changed, encoding='utf-8')
                  print('updated', p)
          PY
          if grep -R -n --include='*.js' --include='*.mjs' --include='*.html' 'mol-app-v2-' pwa; then
            echo 'ERROR: remaining V2 API route in production frontend'
            exit 1
          fi
          node --check pwa/web/live.js
          node --check pwa/web/details.js
          node --check pwa/web/worktime.js
      - name: Remove temporary workflow and commit cutover
        run: |
          git rm .github/workflows/v3-backend-cutover.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pwa
          git commit -m 'Cut frontend over to V3 backend routes'
          git push origin HEAD:main
