name: Validate Stage 11 frontend integration
on:
  push:
    branches: [codex/stage9-closeout-stage10-foundation]
    paths:
      - 'stage10/**'
      - '.github/workflows/stage10-validate.yml'
  workflow_dispatch:
jobs:
  stage11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check integrated JavaScript syntax
        run: |
          for f in stage10/shared/roles.js stage10/shared/processes.js stage10/shared/auth-demo.js stage10/shared/api.js stage10/shared/regression-guards.js stage10/mobile/app.js stage10/mobile/worker-details.js stage10/mobile/spec-completion.js stage10/mobile/report-integrity.js stage10/mobile/manager.js stage10/mobile/live.js stage10/mobile/live-actions.js stage10/web/app.js stage10/web/details.js stage10/web/worktime.js stage10/web/leader-messages.js stage10/web/live.js stage10/web/live-actions.js; do node --check "$f"; done
      - name: Check role and process boundaries
        run: |
          grep -q 'WORKER: Object.freeze({ mobile: true, web: false' stage10/shared/roles.js
          grep -q 'LEADER: Object.freeze({ mobile: true, web: true' stage10/shared/roles.js
          grep -q 'ADMIN: Object.freeze({ mobile: true, web: true' stage10/shared/roles.js
          grep -q 'data-required-roles="LEADER,ADMIN"' stage10/web/index.html
          grep -q 'data-role-hint="WORKER"' stage10/mobile/index.html
          for code in PAKOWANIE KOMPLETACJA DYZUR ZWROTY BIURO PORZADKI_KARTONY PRZYGOTOWANIE_STANOWISKA MAGAZYN PRZERWA INNE; do grep -q "$code" stage10/shared/processes.js; done
          grep -q "filter((code) => code !== 'BIURO')" stage10/shared/processes.js
          ! grep -R -q 'SORTOWANIE\|Sortowanie\|SORT</small>' stage10/mobile stage10/web stage10/shared/*.js
      - name: Check live read integration
        run: |
          grep -q 'mol-app-v2-auth-session' stage10/shared/api.js
          for ep in mol-app-v2-worker-status mol-app-v2-norms-daily mol-app-v2-norms-monthly mol-app-v2-messages; do grep -q "$ep" stage10/mobile/live.js; done
          for ep in mol-app-v2-leader-team mol-app-v2-employee-history mol-app-v2-report-attendance mol-app-v2-report-performance mol-app-v2-audit-history mol-app-v2-user-list mol-app-v2-corrections-queue mol-app-v2-leader-message-recipients; do grep -q "$ep" stage10/web/live.js; done
          grep -q 'mol.v2.stage11.read-e2e' stage10/mobile/live.js
          grep -q 'mol.v2.stage11.read-e2e' stage10/web/live.js
      - name: Check live write integration
        run: |
          for ep in mol-app-v2-attendance-start mol-app-v2-attendance-finish mol-app-v2-attendance-reopen mol-app-v2-attendance-correct mol-app-v2-process-start mol-app-v2-process-change mol-app-v2-process-logout mol-app-v2-message-shown mol-app-v2-message-ack mol-app-v2-leader-message mol-app-v2-correction-preview mol-app-v2-correction-approve mol-app-v2-correction-reject mol-app-v2-user-create mol-app-v2-user-active mol-app-v2-user-password-reset; do grep -Rq "$ep" stage10/mobile/live-actions.js stage10/web/live-actions.js; done
          grep -Rq 'request_id' stage10/mobile/live-actions.js stage10/web/live-actions.js
          grep -q 'expected_version' stage10/mobile/live-actions.js
          grep -Rq 'approved_hash' stage10/mobile/live-actions.js stage10/web/live-actions.js
          grep -Rq 'can_reset_password' stage10/mobile/live-actions.js stage10/web/live-actions.js
      - name: Check regression guards
        run: |
          grep -q "readRetry: 'GET_ONCE'" stage10/shared/regression-guards.js
          grep -q "writeRetry: 'MANUAL_ONLY'" stage10/shared/regression-guards.js
          grep -q 'inflightReadDeduplication: true' stage10/shared/regression-guards.js
          grep -q 'session401Redirect: true' stage10/shared/regression-guards.js
          grep -q "staleWriteProtection: 'EXPECTED_VERSION_BACKEND_AUTHORITY'" stage10/shared/regression-guards.js
          grep -q '../shared/regression-guards.js' stage10/mobile/app.js
          grep -q '../shared/regression-guards.js' stage10/web/app.js
          grep -q 'dataset.busy' stage10/mobile/live-actions.js
          grep -q 'dataset.busy' stage10/web/live-actions.js
          grep -q 'expected_version' stage10/mobile/live-actions.js
      - name: Check backend authority and no demo runtime
        run: |
          ! grep -R -E 'Kamil Kaczmarek|Aneta Nowak|Tomasz Wójcik|Piotr Wiśniewski|Magda Zielińska|Joanna Mazur' stage10/mobile stage10/web
          ! grep -R -q 'mol:stage10-demo' stage10/mobile stage10/web
          ! grep -R -q 'demoAttendance' stage10/mobile stage10/web
          ! grep -R -q 'data-demo-role' stage10/mobile stage10/web
          grep -q "aggregateSource='backend-v2'" stage10/mobile/report-integrity.js
          grep -q "aggregateMethod='backend-weighted'" stage10/web/weighted-report.js
          grep -q 'Agregacja grupowa liczona wyłącznie przez backend V2' stage10/web/details.js
      - name: Check UI surfaces and actions
        run: |
          grep -q 'Moja norma' stage10/mobile/index.html
          grep -q 'data-norm-period="today"' stage10/mobile/index.html
          grep -q 'data-norm-period="month"' stage10/mobile/index.html
          grep -q 'Korekta czasu pracy' stage10/mobile/worker-details.js
          grep -q 'Opcjonalne narzędzia magazynowe' stage10/mobile/worker-details.js
          grep -q 'Raport wydajności' stage10/mobile/manager.js
          grep -q 'Wyślij komunikat' stage10/mobile/manager.js
          grep -q 'Kolejka korekt' stage10/web/details.js
          grep -q 'Raport czasu pracy' stage10/web/worktime.js
          grep -q 'Raport PICK / PAK' stage10/web/details.js
          grep -q 'Wyślij komunikat' stage10/web/leader-messages.js
          grep -q 'Historia operacji' stage10/web/details.js
      - name: Check auth, no ESTYL logo load and no secrets
        run: |
          grep -q '>Hasło<' stage10/mobile/login.html
          grep -q '>Hasło<' stage10/web/login.html
          grep -q 'Wersja aplikacji: V2' stage10/mobile/login.html
          grep -q 'Wersja aplikacji: V2' stage10/web/login.html
          ! grep -R -q '<script src="../../logo.js"' stage10/mobile stage10/web
          ! grep -R -E 'Bearer [A-Za-z0-9._-]{20,}|pbkdf2-sha256\$600000\$|PHPSESSID=|CHAT_ALERT_WEBHOOK|password_hash' stage10
