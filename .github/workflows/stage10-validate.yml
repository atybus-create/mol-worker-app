name: Validate Stage 10 frontend
on:
  push:
    branches: [codex/stage9-closeout-stage10-foundation]
    paths:
      - 'stage10/**'
      - '.github/workflows/stage10-validate.yml'
  workflow_dispatch:
jobs:
  stage10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Stage 10 JavaScript
        run: |
          node --check stage10/shared/roles.js
          node --check stage10/shared/processes.js
          node --check stage10/shared/warehouse-tools.js
          node --check stage10/shared/brand.js
          node --check stage10/shared/auth-demo.js
          node --check stage10/shared/states.js
          node --check stage10/mobile/app.js
          node --check stage10/mobile/worker-details.js
          node --check stage10/mobile/spec-completion.js
          node --check stage10/mobile/report-integrity.js
          node --check stage10/mobile/manager.js
          node --check stage10/web/app.js
          node --check stage10/web/details.js
          node --check stage10/web/weighted-report.js
          node --check stage10/web/worktime.js
          node --check stage10/web/worktime-completion.js
          node --check stage10/web/leader-messages.js
          node --check stage10/web/leader-message-history.js
          node --check stage10/web/spec-completion.js
      - name: Check approved role model
        run: |
          grep -q 'WORKER: Object.freeze({ mobile: true, web: false' stage10/shared/roles.js
          grep -q 'LEADER: Object.freeze({ mobile: true, web: true, managerMobile: true' stage10/shared/roles.js
          grep -q 'ADMIN: Object.freeze({ mobile: true, web: true, managerMobile: true' stage10/shared/roles.js
          grep -q 'WORKER nie otrzymuje panelu WWW' stage10/README.md
          grep -q 'Panel WWW niedostępny dla WORKER' stage10/web/app.js
          grep -q 'managerMobileNav' stage10/mobile/index.html
      - name: Check canonical process catalog and BIURO scope
        run: |
          for code in PAKOWANIE KOMPLETACJA DYZUR ZWROTY BIURO PORZADKI_KARTONY PRZYGOTOWANIE_STANOWISKA MAGAZYN PRZERWA INNE; do grep -q "$code" stage10/shared/processes.js; done
          grep -q "filter((code) => code !== 'BIURO')" stage10/shared/processes.js
          grep -q 'allowedProcesses = window.MOLProcesses.allowedFor(role)' stage10/mobile/worker-details.js
          ! grep -R -q 'SORTOWANIE\|Sortowanie\|SORT</small>' stage10/mobile stage10/web stage10/shared/*.js
      - name: Check auth and frozen ESTYL brand
        run: |
          test -f stage10/shared/brand.js
          grep -q '../../logo.js' stage10/mobile/login.html
          grep -q '../../logo.js' stage10/web/login.html
          grep -q 'window.ESTYL_LOGO' stage10/shared/brand.js
          grep -q '>Hasło<' stage10/mobile/login.html
          grep -q '>Hasło<' stage10/web/login.html
          grep -q 'Wersja aplikacji: V2' stage10/mobile/login.html
          grep -q 'Wersja aplikacji: V2' stage10/web/login.html
          ! grep -q 'Przypomnij PIN' stage10/mobile/login.html
          ! grep -q 'Hasło / PIN' stage10/mobile/login.html
          ! grep -q 'Hasło / PIN' stage10/web/login.html
      - name: Check final UI surfaces
        run: |
          test -f stage10/mobile/login.html
          test -f stage10/web/login.html
          test -f stage10/shared/states.css
          test -f stage10/mobile/worker-details.css
          test -f stage10/mobile/spec-completion.css
          test -f stage10/mobile/manager.css
          test -f stage10/web/details.css
          test -f stage10/web/worktime.js
          test -f stage10/web/worktime-completion.js
          test -f stage10/web/leader-messages.js
          test -f stage10/web/leader-messages.css
          test -f stage10/web/spec-completion.css
          grep -q 'Sesja wygasła' stage10/shared/states.js
          grep -q 'Brak połączenia' stage10/shared/states.js
          grep -q 'Korekta czasu pracy' stage10/mobile/worker-details.js
          grep -q 'Potwierdzam odbiór' stage10/mobile/worker-details.js
          grep -q 'Korekty' stage10/mobile/manager.js
          grep -q 'Eksport XLSX' stage10/web/details.js
          grep -q 'Historia operacji' stage10/web/details.js
      - name: Check worker attendance states and exact actions
        run: |
          grep -q 'MONITI Rozpocznij pracę' stage10/mobile/spec-completion.js
          grep -q 'MONITI Zakończ pracę' stage10/mobile/spec-completion.js
          grep -q 'Cofnij zakończenie dnia' stage10/mobile/spec-completion.js
          grep -q 'Zmień godziny pracy' stage10/mobile/spec-completion.js
          grep -q '31 dni wstecz' stage10/mobile/spec-completion.js
          grep -q 'closesProcessAtSameInstant: true' stage10/mobile/spec-completion.js
          grep -q "nextScreen: 'process'" stage10/mobile/spec-completion.js
          grep -q 'processAutoStart: false' stage10/mobile/spec-completion.js
      - name: Check worker collapsible daily and monthly norms
        run: |
          grep -q 'Moja norma' stage10/mobile/index.html
          grep -q 'data-norm-period="today"' stage10/mobile/index.html
          grep -q 'data-norm-period="month"' stage10/mobile/index.html
          grep -q '>Norma dziś<' stage10/mobile/index.html
          grep -q '>Norma miesięczna<' stage10/mobile/index.html
          grep -q 'normDrawers' stage10/mobile/app.js
          grep -q 'Ilość łącznie' stage10/mobile/index.html
          grep -q 'Ilość do normy' stage10/mobile/index.html
          grep -q 'Ilość poza normą' stage10/mobile/index.html
          grep -q 'Procent normy' stage10/mobile/index.html
          grep -q '1 PAK = 1 j.n. · 3 PICK = 1 j.n.' stage10/mobile/index.html
          grep -q 'Czasy wszystkich procesów' stage10/mobile/spec-completion.js
          grep -q 'Czas międzyprocesowy' stage10/mobile/spec-completion.js
          grep -q 'Świeżość danych' stage10/mobile/spec-completion.js
      - name: Check immediate MAGAZYN activation and optional tools
        run: |
          test -f stage10/shared/warehouse-tools.js
          grep -q 'Terminy – aplikacja magazynowa' stage10/shared/warehouse-tools.js
          grep -q 'https://atybus-create.github.io/mol-magazyn-terminy-pwa/' stage10/shared/warehouse-tools.js
          grep -q 'Batch reader' stage10/shared/warehouse-tools.js
          grep -q 'https://atybus-create.github.io/mol-magazyn-terminy-pwa/batch-reader/' stage10/shared/warehouse-tools.js
          grep -q 'Kliknięcie od razu aktywuje proces' stage10/mobile/worker-details.js
          grep -q 'Proces MAGAZYN jest aktywny' stage10/mobile/worker-details.js
          grep -q 'Opcjonalne narzędzia magazynowe' stage10/mobile/worker-details.js
          grep -q 'MAGAZYN został aktywowany już przez kliknięcie kafla procesu' stage10/mobile/worker-details.js
          grep -q "const action = previousCode ? 'process-change' : 'process-start'" stage10/mobile/worker-details.js
          grep -q 'mol:stage10-demo-process-activate' stage10/mobile/worker-details.js
          grep -q 'processCode: selected.code' stage10/mobile/app.js
          grep -q 'target="_blank" rel="noopener noreferrer"' stage10/mobile/worker-details.js
      - name: Check active process and worker messages
        run: |
          grep -q 'ZMIEŃ PROCES' stage10/mobile/spec-completion.js
          grep -q 'WYLOGUJ Z PROCESU' stage10/mobile/spec-completion.js
          grep -q 'PODGLĄD NORMY' stage10/mobile/spec-completion.js
          grep -q 'Timer procesu' stage10/mobile/spec-completion.js
          grep -q 'Wykonanie właściwe' stage10/mobile/spec-completion.js
          grep -q '>Nowe<' stage10/mobile/spec-completion.js
          grep -q '>Archiwum<' stage10/mobile/spec-completion.js
          grep -q 'mol:stage10-demo-message-shown' stage10/mobile/worker-details.js
          grep -q 'mol:stage10-demo-message-ack' stage10/mobile/worker-details.js
      - name: Check leader monitoring completeness
        run: |
          grep -q 'START' stage10/web/spec-completion.js
          grep -q 'Aktywność aplikacji' stage10/web/spec-completion.js
          grep -q 'Czas bieżącego procesu' stage10/web/spec-completion.js
          grep -q 'Czas międzyprocesowy' stage10/web/spec-completion.js
          grep -q 'Mapowanie ES' stage10/web/spec-completion.js
          grep -q 'Aktywne alerty' stage10/web/spec-completion.js
          grep -q 'Historia zdarzeń osoby' stage10/web/spec-completion.js
      - name: Check leader performance reporting quantities and weighted aggregate
        run: |
          grep -q 'PICK dziś' stage10/web/index.html
          grep -q 'PAK dziś' stage10/web/index.html
          grep -q 'PICK/PAK dziś' stage10/web/index.html
          grep -q 'PICK do normy' stage10/web/details.js
          grep -q 'PICK poza normą' stage10/web/details.js
          grep -q 'PAK do normy' stage10/web/details.js
          grep -q 'PAK poza normą' stage10/web/details.js
          grep -q 'PICK/PAK do normy' stage10/web/details.js
          grep -q 'PICK/PAK poza normą' stage10/web/details.js
          grep -q 'Zaznacz wszystkich' stage10/web/details.js
          grep -q 'Generuj raport dla zaznaczonych' stage10/web/details.js
          grep -q 'weighted-numerator-denominator' stage10/web/weighted-report.js
          grep -q 'combinedEligible = packEligible + pickEligible / 3' stage10/web/weighted-report.js
          grep -q 'weighted-numerator-denominator' stage10/mobile/report-integrity.js
          grep -q 'PICK/PAK grupy · ważone' stage10/mobile/report-integrity.js
      - name: Check separate complete work time reporting
        run: |
          grep -q "label.textContent = 'Wydajność'" stage10/web/app.js
          grep -q "worktimeButton.dataset.section = 'worktime'" stage10/web/app.js
          grep -q 'Raport czasu pracy' stage10/web/worktime.js
          grep -q 'Zaznacz wszystkich' stage10/web/worktime.js
          grep -q '<th>START</th><th>STOP</th><th>Czas pracy</th>' stage10/web/worktime.js
          grep -q 'data-worktime-status' stage10/web/worktime-completion.js
          grep -q 'Czasy procesów' stage10/web/worktime-completion.js
          grep -q 'Czas międzyprocesowy' stage10/web/worktime-completion.js
          grep -q 'Korekty' stage10/web/worktime-completion.js
          grep -q 'Synchronizacja' stage10/web/worktime-completion.js
          grep -q 'Bieżący miesiąc' stage10/web/worktime-completion.js
      - name: Check leader manual communication and history
        run: |
          grep -q "leaderMessagesButton.dataset.section = 'leader-messages'" stage10/web/app.js
          grep -q 'Wyślij komunikat' stage10/web/leader-messages.js
          grep -q 'Wszyscy aktualnie w pracy' stage10/web/leader-messages.js
          grep -q 'maxlength="2000"' stage10/web/leader-messages.js
          grep -q 'Wymagaj potwierdzenia odbioru' stage10/web/leader-messages.js
          grep -q "requestType: 'leader-message'" stage10/web/leader-messages.js
          grep -q 'aplikacja aktywna' stage10/web/leader-message-history.js
          grep -q 'Komunikaty i status odbioru' stage10/web/leader-message-history.js
          grep -q 'data-message-history-next' stage10/web/leader-message-history.js
          grep -q 'manager-messages' stage10/mobile/manager.js
          grep -q 'data-mobile-message-all-open' stage10/mobile/manager.js
          grep -q 'data-mobile-message-ack' stage10/mobile/manager.js
      - name: Check no secrets in Stage 10
        run: |
          ! grep -R -E 'Bearer [A-Za-z0-9._-]{20,}|pbkdf2-sha256\$600000\$|PHPSESSID=|CHAT_ALERT_WEBHOOK|password_hash' stage10
