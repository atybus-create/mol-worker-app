name: Build MOL V3 Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'pwa/shared/api.js'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle -p android --no-daemon assembleDebug

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MOL-App-V3-mobile.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MOL-App-V3-mobile
          path: MOL-App-V3-mobile.apk
          if-no-files-found: error

      - name: Publish latest internal APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mol-v3-mobile-latest --yes --cleanup-tag || true
          gh release create mol-v3-mobile-latest MOL-App-V3-mobile.apk             --title "MOL App V3 Mobile — latest internal APK"             --notes "Internal debug-signed Android build from commit $GITHUB_SHA."
