name: Validate frontend
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check config.js
          node --check logo.js
          node --check profile-ui.js
          node --check sw.js
      - name: Check required UI and integrations
        run: |
          grep -q 'MAGAZYN' app.js
          grep -q 'mol-app-leader' config.js
          grep -q "attendance: 'mol-app-attendance'" config.js
          grep -q 'MONITI Rozpocznij pracę' index.html
          grep -q 'MONITI Zakończ pracę' index.html
          grep -q "changeAttendance('start')" app.js
          grep -q "changeAttendance('finish')" app.js
          ! grep -q 'id="endDayButton"' index.html
          grep -q 'mol-magazyn-terminy-pwa/' config.js
          grep -q 'batch-reader/' config.js
          grep -q 'Terminy – aplikacja magazynowa' index.html
          grep -q 'Batch reader' index.html
          grep -q 'ESTYL_LOGO' logo.js
          grep -q 'MutationObserver' profile-ui.js
          grep -q 'hydrateProfile' profile-ui.js
          ! grep -q 'setTimeout' profile-ui.js
          ! grep -q 'setInterval' profile-ui.js
          grep -q 'profile-ui.js?v=0.7.18' index.html
          grep -q 'logoutProcessButton' index.html
          grep -q 'warehouseLogoutProcessButton' index.html
          grep -q 'warehouseChangeProcessButton' index.html
          grep -q 'warehouseShowNormButton' index.html
          grep -q 'warehouseChangeProcessButton' app.js
          grep -q 'warehouseShowNormButton' app.js
          grep -q 'warehouseProcessTimer' index.html
          grep -q 'warehouseProcessTimer' app.js
          grep -q 'no_process_minutes' app.js
          grep -q 'Czas międzyprocesowy' app.js
          grep -q 'Czas międzyprocesowy' index.html
          grep -q "action:'logout_process'" app.js
          grep -q "MONITI_FINISHED" app.js
          grep -q "blocked('FINISHED')" app.js
          grep -q "version: '0.7.18'" config.js
          grep -q 'PAK (szt.)' index.html
          grep -q 'PIK (szt.)' index.html
          grep -q 'production(e.eligible_pak,e.outside_pak)' app.js
          grep -q 'production(e.eligible_pick,e.outside_pick)' app.js
          grep -q "Logowanie…" app.js
          grep -q "timeoutMs=30000" app.js
          grep -q "loginInFlight" app.js
          grep -q "teamRefreshing" app.js
          grep -q "action==='team'?60000:30000" app.js
          grep -q "message_history" app.js
          grep -q "leaderMessageHistory" app.js
          grep -q "request_id" app.js
          grep -q "action:'shown'" app.js
          grep -q "action:'history'" app.js
          grep -q "loadOlderMessages" index.html
          grep -q "loadOlderLeaderMessages" index.html
          grep -q "dataWarningBar" index.html
          grep -q "applyFreshness" app.js
          grep -q "Backend jest przeciążony" app.js
          grep -q "statusMs: 30000" config.js
          grep -q "status: 'mol-app-live-metrics'" config.js
          grep -q "setInterval(refreshStatus,C.polling.statusMs)" app.js
          ! grep -q "setInterval(refreshWd" app.js
          ! grep -q "setInterval(refreshAlerts" app.js
          ! grep -q "setInterval(daily" app.js
          grep -q "workerView(S.workerView,false)" app.js
          grep -q "visibilitychange" app.js
          grep -q "resumeRefresh" app.js
          grep -q "alertModal').hidden=true" app.js
          ! grep -q "fetch(" profile-ui.js
      - name: Verify exact ESTYL logo source
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const src=fs.readFileSync('logo.js','utf8');
          const m=src.match(/base64,([^']+)'/);
          if(!m) throw new Error('ESTYL logo data URI not found');
          const hash=crypto.createHash('sha256').update(Buffer.from(m[1],'base64')).digest('hex');
          const expected='d2b22088cd9fc62e9251afc02485a7644ff57c6ff1350e3c391f745b4c91a7e0';
          if(hash!==expected) throw new Error(`Logo hash mismatch: ${hash}`);
          console.log('ESTYL logo SHA-256 OK:',hash);
          NODE
      - name: Check no test tokens or chat secrets
        run: |
          ! grep -R -E 'ETAP7FRONTENDTESTTOKEN|ETAP7WORKERROLETESTTOKEN|PHPSESSID|CHAT_ALERT_WEBHOOK' --exclude-dir=.git --exclude=validate.yml .
      - name: Check browser CORS to n8n
        run: |
          curl -sS -X OPTIONS -D cors-headers.txt -o /dev/null 'https://n8n.estyl.team/webhook/mol-app-config' \
            -H 'Origin: https://atybus-create.github.io' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: authorization'
          cat cors-headers.txt
          grep -qi '^access-control-allow-origin:' cors-headers.txt
