name: Stage 6 backend sync
on:
  push:
    branches: [codex/stage6-closeout-permissions, main]
    paths:
      - 'backend/v2/**'
      - 'scripts/test-v2-*.cjs'
      - '.github/workflows/stage6-sync.yml'
permissions:
  contents: write
concurrency:
  group: stage6-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate attendance service export
        run: node backend/v2/processes/build-workflows.mjs > backend/v2/workflows/attendance-service.json
      - name: Run backend tests
        run: |
          node --check backend/v2/processes/domain.js
          node --check backend/v2/processes/build-workflows.mjs
          node scripts/validate-v2-contract.js
          node scripts/validate-v2-backend.js
          node scripts/test-v2-password.cjs
          node scripts/test-v2-auth.cjs
          node scripts/test-v2-attendance.cjs
          node scripts/test-v2-attendance-ui.cjs
          node scripts/test-v2-processes.cjs
          node scripts/test-v2-process-permissions-service.cjs
          git diff --check
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const w=JSON.parse(fs.readFileSync('backend/v2/workflows/attendance-service.json','utf8'));
          console.log('Decide SHA256: '+crypto.createHash('sha256').update(w.nodes.find(n=>n.name==='Decide').parameters.jsCode).digest('hex'));
          NODE
      - name: Check main export is reproducible
        if: github.ref == 'refs/heads/main'
        run: git diff --exit-code -- backend/v2/workflows/attendance-service.json
      - name: Commit regenerated export on closeout branch only
        if: github.ref == 'refs/heads/codex/stage6-closeout-permissions'
        run: |
          if git diff --quiet -- backend/v2/workflows/attendance-service.json; then
            echo 'Export already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/v2/workflows/attendance-service.json
          git commit -m 'build(v2): regenerate stage 6 attendance service'
          git push origin HEAD:codex/stage6-closeout-permissions
