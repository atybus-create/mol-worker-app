name: Stage 6 backend sync
on:
  push:
    branches: [codex/stage6-closeout-permissions]
    paths:
      - 'backend/v2/processes/**'
      - 'backend/v2/attendance/**'
      - 'backend/v2/manifest.json'
      - 'backend/v2/schema.json'
      - 'scripts/test-v2-processes.cjs'
      - '.github/workflows/stage6-sync.yml'
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/stage6-closeout-permissions
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate attendance service export
        run: node backend/v2/processes/build-workflows.mjs > backend/v2/workflows/attendance-service.json
      - name: Run backend tests
        run: |
          node --check backend/v2/processes/domain.js
          node --check backend/v2/processes/build-workflows.mjs
          node scripts/validate-v2-contract.js
          node scripts/validate-v2-backend.js
          node scripts/test-v2-password.cjs
          node scripts/test-v2-auth.cjs
          node scripts/test-v2-attendance.cjs
          node scripts/test-v2-attendance-ui.cjs
          node scripts/test-v2-processes.cjs
      - name: Commit regenerated export
        run: |
          if git diff --quiet -- backend/v2/workflows/attendance-service.json; then
            echo 'Export already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/v2/workflows/attendance-service.json
          git commit -m 'build(v2): regenerate stage 6 attendance service'
          git push origin HEAD:codex/stage6-closeout-permissions
