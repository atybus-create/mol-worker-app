name: Validate V3 PWA
on:
  push:
    branches: [main, fix-v3-worktime-corrections-20260915]
  workflow_dispatch:
jobs:
  validate-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check V3 JavaScript syntax
        run: |
          node --check pwa/web/app.js
          node --check pwa/web/worktime.js
          node --check pwa/web/live.js
          node --check pwa/web/stage5.js
          node --check pwa/mobile/app.js
          node --check pwa/mobile/stage5.js
          node --check pwa/sw.js
      - name: Run V3 regression tests
        run: |
          set -e
          for test in pwa/tests/*.test.mjs; do
            echo "Running $test"
            node "$test"
          done
