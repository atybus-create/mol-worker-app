name: Stage 6 backend sync
on:
  push:
    branches: [codex/stage6-closeout-permissions, main]
    paths:
      - 'backend/v2/**'
      - 'scripts/test-v2-*.cjs'
      - '.github/workflows/stage6-sync.yml'
permissions:
  contents: write
concurrency:
  group: stage6-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate attendance service export
        run: |
          if [ -f backend/v2/metrics/build-all.mjs ]; then
            node backend/v2/metrics/build-all.mjs
          else
            node backend/v2/processes/build-workflows.mjs > backend/v2/workflows/attendance-service.json
          fi
      - name: Run backend tests
        run: |
          node --check backend/v2/processes/domain.js
          node --check backend/v2/processes/build-workflows.mjs
          node scripts/validate-v2-contract.js
          node scripts/validate-v2-backend.js
          node scripts/test-v2-password.cjs
          node scripts/test-v2-auth.cjs
          node scripts/test-v2-attendance.cjs
          node scripts/test-v2-attendance-ui.cjs
          node scripts/test-v2-processes.cjs
          node scripts/test-v2-process-permissions-service.cjs
          git diff --check
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const w=JSON.parse(fs.readFileSync('backend/v2/workflows/attendance-service.json','utf8'));
          console.log('Decide SHA256: '+crypto.createHash('sha256').update(w.nodes.find(n=>n.name==='Decide').parameters.jsCode).digest('hex'));
          NODE
      - name: Check main export is reproducible
        if: github.ref == 'refs/heads/main'
        run: git diff --exit-code -- backend/v2/workflows/attendance-service.json
      - name: Verify public V2 health and preflight without sessions
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          const base='https://n8n.estyl.team/webhook/mol-app-v2-';
          const origin='https://atybus-create.github.io';
          const health=await fetch(base+'health',{signal:AbortSignal.timeout(20000)});
          assert.equal(health.status,200,'V2 health HTTP');
          const body=await health.json();
          assert.equal(body.ok,true);assert.equal(body.service,'MOL_APP_V2');
          console.log('V2 health PASS HTTP 200');
          // OPTIONS only: no credentials, no login, no attendance or process writes.
          for(const [path,method] of [['auth-login','POST'],['attendance-status','GET'],['process-start','POST'],['process-change','POST'],['process-logout','POST']]) {
            const response=await fetch(base+path,{method:'OPTIONS',signal:AbortSignal.timeout(20000),headers:{Origin:origin,'Access-Control-Request-Method':method,'Access-Control-Request-Headers':'authorization,content-type'}});
            const allowOrigin=response.headers.get('access-control-allow-origin');
            const methods=(response.headers.get('access-control-allow-methods')||'').split(',').map(s=>s.trim().toUpperCase());
            const headers=(response.headers.get('access-control-allow-headers')||'').split(',').map(s=>s.trim().toLowerCase());
            console.log(JSON.stringify({path,status:response.status,allowOrigin,methods,headers}));
            assert.ok([200,204].includes(response.status),path+' preflight HTTP');
            assert.ok([origin,'*'].includes(allowOrigin),path+' allowed origin');
            assert.ok(methods.includes(method),path+' allowed method');
            assert.ok(headers.includes('authorization'),path+' authorization header');
            assert.ok(headers.includes('content-type')||headers.includes('*'),path+' content type');
          }
          console.log('Public V2 preflight PASS: 5 endpoints; no authenticated calls.');
          NODE
      - name: Commit regenerated export on closeout branch only
        if: github.ref == 'refs/heads/codex/stage6-closeout-permissions'
        run: |
          if git diff --quiet -- backend/v2/workflows/attendance-service.json; then
            echo 'Export already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/v2/workflows/attendance-service.json
          git commit -m 'build(v2): regenerate stage 6 attendance service'
          git push origin HEAD:codex/stage6-closeout-permissions
