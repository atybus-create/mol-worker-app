<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#050b12">
  <title>MOL App V2 — TEST</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050b12;color:#f4f8fb;font-family:Inter,system-ui,sans-serif}
    main{text-align:center;padding:24px}p{color:#9fb6c9}a{color:#12c8ff}
  </style>
</head>
<body>
  <main>
    <h1>MOL App V2</h1>
    <p>Środowisko TEST · build 20260909.1</p>
    <p>Otwieram właściwy ekran logowania…</p>
    <noscript><p><a href="./mobile/login.html?v=20260909.1">Mobile</a> · <a href="./web/login.html?v=20260909.1">WWW</a></p></noscript>
  </main>
  <script>
    (() => {
      const requested = new URLSearchParams(location.search).get('surface');
      const mobileDevice = matchMedia('(max-width: 760px)').matches || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      const surface = requested === 'mobile' || requested === 'web' ? requested : (mobileDevice ? 'mobile' : 'web');
      location.replace(`./${surface}/login.html?v=20260909.1`);
    })();
  </script>
</body>
</html>
